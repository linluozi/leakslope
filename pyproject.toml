[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakslope"
version = "0.1.0"
description = "Per-call fd/thread leak adjudication by slope, not by before/after snapshots"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
dependencies = []

[project.scripts]
leakslope = "leakslope.cli:main"

[tool.setuptools]
packages = ["leakslope"]
